---
# tasks/main.yaml — dispatch to profile-specific tasks then run common cleanup

- name: reset | assert sing_box_reset_profile is set
  ansible.builtin.assert:
    that:
      - sing_box_reset_profile is defined
      - sing_box_reset_profile in ['tproxy', 'server']
    fail_msg: >-
      sing_box_reset_profile must be set to either 'tproxy' or 'server'.
      Pass it via -e sing_box_reset_profile=<profile> or define it in group_vars.

- name: reset | tproxy-specific cleanup
  when: sing_box_reset_profile == 'tproxy'
  ansible.builtin.include_tasks: tproxy.yaml

- name: reset | server-specific cleanup
  when: sing_box_reset_profile == 'server'
  ansible.builtin.include_tasks: server.yaml

- name: reset | common cleanup
  ansible.builtin.include_tasks: common.yaml
