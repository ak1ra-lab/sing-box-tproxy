---
- name: validate sing_box_user
  ansible.builtin.assert:
    that:
      - sing_box_user is defined
      - sing_box_user.name is defined
      - sing_box_user.uid is defined
    fail_msg: "sing_box_user must be defined with name and uid."
    quiet: true

- name: validate sing_box_group
  ansible.builtin.assert:
    that:
      - sing_box_group is defined
      - sing_box_group.name is defined
      - sing_box_group.gid is defined
    fail_msg: "sing_box_group must be defined with name and gid."
    quiet: true

- name: validate sing_box_apt_packages
  ansible.builtin.assert:
    that:
      - sing_box_apt_packages is defined
      - sing_box_apt_packages | length > 0
    fail_msg: "sing_box_apt_packages must be defined and not empty."
    quiet: true

- name: validate directories definition
  ansible.builtin.assert:
    that:
      - sing_box_etc_dir is defined
      - sing_box_log_dir is defined
      - sing_box_state_dir is defined
    fail_msg: "Standard directory variables (sing_box_etc_dir, etc.) must be defined."
    quiet: true

- name: validate custom rules (no ip_cidr allowed in rules list)
  ansible.builtin.assert:
    that:
      - item.rules | selectattr('ip_cidr', 'defined') | list | length == 0
    fail_msg: >-
      ip_cidr is not allowed in {{ item.name }}. Please move IP CIDR rules to {{ item.ip4_name }} or {{ item.ip6_name }}.
  loop:
    - name: sing_box_custom_rejected_rule_set_rules
      ip4_name: sing_box_custom_rejected_ip4
      ip6_name: sing_box_custom_rejected_ip6
      rules: "{{ sing_box_custom_rejected_rule_set_rules | default([]) }}"
    - name: sing_box_custom_bypassed_rule_set_rules
      ip4_name: sing_box_custom_bypassed_ip4
      ip6_name: sing_box_custom_bypassed_ip6
      rules: "{{ sing_box_custom_bypassed_rule_set_rules | default([]) }}"
