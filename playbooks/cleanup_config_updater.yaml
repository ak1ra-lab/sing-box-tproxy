---
# One-off cleanup playbook: remove legacy sing-box-config-updater.{service,timer}
# units that were deployed before the rename to sing-box-config.{service,timer}.
#
# Usage:
#   ansible-playbook playbooks/cleanup_config_updater.yaml -v
- name: cleanup legacy sing-box-config-updater units
  hosts: "{{ playbook_hosts | default('sing-box-tproxy') }}"
  become: true

  tasks:
    - name: stop and disable sing-box-config-updater.timer
      ansible.builtin.systemd_service:
        name: sing-box-config-updater.timer
        state: stopped
        enabled: false
      failed_when: false

    - name: stop sing-box-config-updater.service
      ansible.builtin.systemd_service:
        name: sing-box-config-updater.service
        state: stopped
      failed_when: false

    - name: remove legacy unit files
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /etc/systemd/system/sing-box-config-updater.service
        - /etc/systemd/system/sing-box-config-updater.timer
      notify: systemctl daemon-reload

  handlers:
    - name: systemctl daemon-reload
      ansible.builtin.systemd_service:
        daemon_reload: true
