---
# Examples:
#
#   ansible-playbook playbooks/sing_box_reboot.yaml -v
#   ansible-playbook playbooks/sing_box_reboot.yaml -e playbook_hosts=sing-box-tproxy-node01 -v

- name: reboot sing-box process
  hosts: "{{ playbook_hosts | default('sing-box-tproxy') }}"
  become: true

  tasks:
    - name: reboot sing-box.service
      ansible.builtin.systemd_service:
        name: sing-box
        state: restarted
